<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Advocacia Integrada - Serviços e Honorários</title>
</head>
<body>
    <nav class="nav-privado">
        <a href="painel.html">Geral</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html" style="border-bottom: 2px solid var(--gold-accent);">Serviços</a>
        <a href="agendamentos.html">Novo Agendamento</a>
        <a href="consulta_agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Histórico</a>
        <a href="index.html" class="nav-login" style="color: #ea580c !important;" title="Sair">Sair</a>
    </nav>

    <header class="banner">
        <h1>Catálogo de Serviços e Honorários</h1>
        <p>Configure os preços e o tempo estimado de cada ato jurídico</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Cadastrar Novo Serviço</h2>
            <form action="/salvar-servico" method="POST">
                <label for="descricao">Descrição do Serviço:</label>
                <input type="text" id="descricao" name="descricao" placeholder="Ex: Consultoria Societária" required>

                <label for="preco">Honorário (R$):</label>
                <input type="number" step="0.01" id="preco" name="preco" placeholder="0.00" required>

                <label for="tempo_estimado">Tempo Estimado (minutos):</label>
                <input type="number" id="tempo_estimado" name="tempo_estimado" placeholder="60" required>

                <div style="margin-top: 15px;">
                    <button type="submit">Salvar Serviço no Catálogo</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Serviços Disponíveis</h2>
            <table>
                <thead>
                    <tr><th>Descrição</th><th>Preço (R$)</th><th>Tempo (min)</th></tr>
                </thead>
                <tbody id="lista-servicos"></tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('/listar-servicos')
            .then(res => res.json())
            .then(servicos => {
                const corpo = document.getElementById('lista-servicos');
                servicos.forEach(s => {
                    corpo.innerHTML += `<tr><td><strong>${s.descricao}</strong></td><td>R$ ${parseFloat(s.preco).toFixed(2)}</td><td>${s.tempo_estimado}</td></tr>`;
                });
            });
    </script>
    <footer class="rodape"><p>&copy; 2026 Advocacia Integrada - Módulo Privado</p></footer>
</body>
</html>
