<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Advocacia Integrada - Restrito</title>
    <style>
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 70vh; }
        .card-login { width: 100%; max-width: 400px; padding: 40px; background: white; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-top: 4px solid var(--gold-accent); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="sobrenos.html">Sobre Nós</a>
        <a href="atuacao.html">Áreas de Atuação</a>
        <a href="contato.html">Contato</a>
        <a href="login.html" class="nav-login">👤</a>
    </nav>

    <div class="container login-wrapper">
        <div class="card-login">
            <div style="text-align: center; margin-bottom: 30px;">
                <span style="font-size: 3rem; color: var(--gold-accent);">👤</span>
                <h2>Acesso Restrito</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Autenticação de Profissionais</p>
            </div>

            <form action="/autenticar" method="POST">
                <label for="usuario">Usuário / E-mail:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ex: admin" required>
                
                <label for="senha">Senha Corporativa:</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                
                <div style="margin-top: 25px;">
                    <input type="submit" value="Entrar no Painel">
                </div>
            </form>
        </div>
    </div>
    <footer class="rodape"><p>&copy; 2026 Advocacia Integrada - Sistema Jurídico</p></footer>
</body>
</html>
